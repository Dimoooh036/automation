# Инвентарный файл Ansible.
# Подключение к тестовому серверу выполняется от имени пользователя ansible
# по SSH-ключу, который Ansible-агент получает из /run/secrets.
[test_servers]
test-server ansible_host=test-server ansible_user=ansible ansible_ssh_private_key_file=/home/jenkins/.ssh/ansible_server_key ansible_python_interpreter=/usr/bin/python3

[test_servers:vars]
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
